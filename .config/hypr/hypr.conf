exec-once=/home/patu/.config/awesome/autostart.sh

gaps_in=2
border_size=1
gaps_out=0
rounding=0
max_fps=60 # max fps for updates of config & animations
focus_when_hover=1 # 0 - do not switch the focus when hover (only for tiling)
main_mod=SUPER # For moving, resizing
intelligent_transients=0 # keeps transients always on top.
no_unmap_saving=1 # disables saving unmapped windows (seems to break sometimes)
scratchpad_mon=0 # self-explanatory

# Layout
layout=0 # 0 - dwindle (default), 1 - master
layout {
    no_gaps_when_only=0 # disables gaps and borders when only window on screen
}

# Bar config
Bar {
    height=20
    monitor=0
    enabled=1
    mod_pad_in=8
    no_tray_saving=1 # using this doesnt save the tray between reloads but fixes an issue with the bar disappearing.

    font.main=Noto Sans
    font.secondary=Noto Sans

    col.bg=0xff111111
    col.high=0xffff3333

    module=left,X,0xff8000ff,0xffffffff,1,workspaces
    module=pad,left,10
    module=left,,0xff7000dd,0xff7000dd,1,tray
    module=right,X,0xffffffff,0xff00ff33,1000,$date +%a,\ %b\ %Y\ \ %I:%M\ %p$
}

# colors
col.active_border=0x1494d7
# col.active_border=0x77ff3333
# col.inactive_border=0x77222222

# animations
Animations {
    enabled=0
    speed=10 # for workspaces
    window_resize_speed=10 # for windows
    cheap=1 # highly recommended
    borders=0
    workspaces=0 # not really recommended
}

# keybinds
bind=SUPER,T,exec,alacritty
bind=SUPER,M,exec,pkill Hypr
# bind=SUPER,V,exec,brave-nightly
bind=SUPER,V,exec,brave
bind=SUPER,RETURN,exec,kitty
bind=SUPER,G,exec,google-chrome-stable

bind=SUPER,Q,killactive,
bind=SUPERSHIFTCTRLALT,Q,exec,killall Hypr

bind=SUPER,M,fullscreen,

bind=SUPER,1,workspace,1
bind=SUPER,2,workspace,2
bind=SUPER,3,workspace,3
bind=SUPER,4,workspace,4
bind=SUPER,5,workspace,5
bind=SUPER,6,workspace,6
bind=SUPER,7,workspace,7
bind=SUPER,8,workspace,8
bind=SUPER,9,workspace,9

# Focus
bind=SUPER,h,movefocus,l
bind=SUPER,l,movefocus,r
bind=SUPER,k,movefocus,u
bind=SUPER,j,movefocus,d

bind=SUPERCTRL,h,movewindow,l
bind=SUPERCTRL,l,movewindow,r
bind=SUPERCTRL,k,movewindow,u
bind=SUPERCTRL,j,movewindow,d


bind=SUPER,C,exec,~/.local/bin/edit_config
bind=SUPER,D,exec,killall rofi; rofi -show drun -theme ~/.config/rofi/global/rofi.css
bind=SUPER,SPACE,togglefloating,

# bind=SUPER,S,togglesplit,
bind=SUPERSHIFT,L,splitratio,+
bind=SUPERSHIFT,H,splitratio,-
