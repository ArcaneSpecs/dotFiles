input {
  kb_layout = fi,us
  follow_mouse = 1 
  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
  force_no_accel = true
  repeat_rate = 200
  repeat_delay = 180
  accel_profile = custom
  scroll_points = 0.2 0.0 0.5 1 1.2 1.5
}

general { 
  gaps_in=2
  gaps_out=0
  border_size=1
  #col.active_border=0x9414d7ff
  #col.active_border=0x9414d7ff
  col.active_border=rgba(1494d7ff) 
  #col.active_border=0xcc0055ee
  #col.inactive_border=0xff382D2E
  # col.inactive_border=rgba(382Dff2E)
  no_border_on_floating = true 
  layout = dwindle
  # no_cursor_warps = false 
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  # suppress_portal_warnings = true
  vfr = true
  enable_swallow = true
  swallow_regex = ^(wezterm)$

  # Toggles warning for frozen applications
  enable_anr_dialog = false
}

# NOTE: toggle this and use: "hyprland_logs" in terminal to debug logs
debug {
  disable_logs = true 
}

decoration {
  rounding = 0
  # multisample_edges = true

  active_opacity = 1.0
  inactive_opacity = 1.0

  blur {
    enabled = false 
    size = 1
    passes = 1
    new_optimizations = true
  }

  shadow {
    enabled = true
    ignore_window = true
    offset = 0 4
    range = 30
    render_power = 4
    # col.shadow = rgba(004a55ee)
    color = rgba(004a55ff)
    #col.shadow = rgba(0f1f2fff)
    #col.shadow = rgba(0f1f2fff)

    # blurls = gtk-layer-shell
    # blurls = waybar
    blurls = lockscreen
  }
}

animations {
# global
#   ↳ windows - styles: slide, popin
#     ↳ windowsIn - window open
#     ↳ windowsOut - window close
#     ↳ windowsMove - everything in between, moving, dragging, resizing.
#   ↳ fade
#     ↳ fadeIn - fade in (open) -> layers and windows
#     ↳ fadeOut - fade out (close) -> layers and windows
#     ↳ fadeSwitch - fade on changing activewindow and its opacity
#     ↳ fadeShadow - fade on changing activewindow for shadows
#     ↳ fadeDim - the easing of the dimming of inactive windows
#   ↳ border - for animating the border's color switch speed
#   ↳ borderangle - for animating the border's gradient angle - styles: once (default), loop
#   ↳ workspaces - styles: slide, slidevert, fade
#     ↳ specialWorkspace - styles: same as workspaces

  # INFO: 
  # animation=NAME,ONOFF,SPEED,CURVE,STYLE
  # or
  # animation=NAME,ONOFF,SPEED,CURVE
  # styles: slide, popin, fade

  enabled = true
  bezier = overshot,      1, 0, 1, 1 
  # bezier = smoothIn,    0.5, 1, 1, 1
  # bezier = smoothIn,    1, 1, 0.5, -0.5
  bezier = smoothIn,      0.5, 1, 1, 1
  bezier = smoothOut,     1, 1, 0.5, -0.5
  bezier = overshot_two,  1, 1, 0.1,1.1
  bezier = workspaceAnim, 0.1, 1, 0.05, 1

  # Styles: slide, popin 10%
  animation = windows,     0, 0.5, overshot,  popin 
  animation = windowsOut,  0, 0.5, smoothOut, popin 
  animation = windowsMove, 1, 1,   smoothIn, slide 
  # animation = border, 1, 1, default
  animation = fade,        1, 2, smoothIn
  animation = fadeDim,     1, 2, smoothIn
  animation = workspaces,  1, 3, workspaceAnim 

  # Old animations
  # bezier = overshot, 0.1, 0.9, 0.1, 1.05
  # bezier = smoothOut, 0.36, 0, 0.66, -0.56
  # bezier = smoothIn, 0.1, 1, 0.05, 1
  # bezier = overshot_two,0.05,0.9,0.1,1.1
  #
  # # Styles: slide, popin 10%
  # animation = windows, 1, 5, overshot, slide
  # animation = windowsOut, 1, 4, smoothIn, slide
  # animation = windowsMove, 1, 3, smoothIn, slide
  # # animation = border, 1, 1, default
  # animation = fade, 1, 10, smoothIn
  # animation = fadeDim, 1, 10, smoothIn
  # animation = workspaces, 1, 5, smoothIn 
}

